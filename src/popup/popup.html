<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="header">
      <h2 class="header_logo">Bionify</h2>
    </div>
    <div class="button-container">
      <button id="applyButton">&#128214; Toggle Bionify</button>
    </div>
    <div class="button-container">
      <button id="autoButton">Toggle Auto</button>
    </div>
    <label class="floating-button-setting">
      <input type="checkbox" id="floating-button-enabled" />
      Show floating button
    </label>
    <div class="div-group">
      <div class="small-group">
        <div class="label">Exclude URL</div>
        <input type="text" id="excludePattern" name="highlight" />
        <div class="button-container">
          <button id="excludePageButton">Add Pattern</button>
        </div>
        <div class="label">Highlighted Styles</div>
        <input type="text" id="highlight-input" name="highlight" />
        <label>
          <input type="checkbox" id="highlight-color-enabled" />
          Highlight color
        </label>
        <input type="color" id="highlight-color-input" title="Highlight color" />
      </div>
      <div class="small-group">
        <div class="label">Unhighlighted Styles</div>
        <input type="text" id="rest-input" name="rest" />
      </div>
      <div class="small-group">
        <div class="label">
          Highlight Algorithm
          <a
            href="https://github.com/Cveinnt/bionify#algorithm-specification"
            target="_blank"
            ><b>(?)</b></a
          >
        </div>
        <input type="text" id="algorithmInput" name="algorithm" />
      </div>
      <div class="small-group chinese-settings">
        <div class="label">Chinese Settings</div>
        <input type="text" id="chinese-settings-input" name="chineseSettings" placeholder="Gap Highlight GapOpacity BoldWeight Intensity" />
      </div>
      <div class="small-group snapshot-settings">
        <div class="label">Snapshots</div>
        <input type="text" id="snapshot-name-input" placeholder="Snapshot name" />
        <div class="snapshot-actions">
          <button id="save-snapshot-button">Save</button>
          <button id="apply-snapshot-button">Apply</button>
          <button id="delete-snapshot-button">Delete</button>
        </div>
        <select id="snapshot-select">
          <option value="">Select a snapshot</option>
        </select>
      </div>
      <div class="button-container">
        <button id="restore-button">Restore Default</button>
      </div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
